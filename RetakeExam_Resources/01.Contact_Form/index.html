<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>
<section>
    <div class="columns">
        <div class="card">
            <h2>
            Get in Touch
            </h2>

            <form method="post" action="#">
                <div class="form-content">
                    <label for="name" class="sr-only">Name</label>
                    <input type="text" id="name" name="name" placeholder="Name">

                    <label for="name" class="sr-only">Email</label>
                    <input type="email" id="email" name="email" placeholder="Email">
                </div>

                <div class="form-content">
                    <label for="name" class="sr-only">Message</label>
                    <textarea id="message" name="message" placeholder="Message"></textarea>
                </div>

                <div class="form-content">
                    <input class="submit-button" type="submit" id="submit" name="submit" value="Send">
                </div>

            </form>
        </div>

        <div class="card">
            <h2>
            Follow
            </h2>

            <div class="awesome-icons">
                <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
                <a href="#"><i class="fa-brands fa-facebook"></i></a>
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
                <a href="#"><i class="fa-brands fa-github"></i></a>
                <a href="#"><i class="fa-brands fa-linkedin"></i></a>
                <a href="#"><i class="fa-brands fa-pinterest"></i></a>
                <a href="#"><i class="fa-brands fa-threads"></i></a>
                <a href="#"><i class="fa-solid fa-phone"></i></a>
                <a href="#"><i class="fa-solid fa-envelope"></i></a>
            </div>

        </div>
    </div>
    <div class="columns">

        <div class="card">
            <footer>
                <p>
                © Untitled. All rights reserved
                </p>
                <p>
                Design: <u><strong>HTML & CSS</strong></u>
                </p>
            </footer>
        </div>
    </div>
</section>









</body>
</html>
