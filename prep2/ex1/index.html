<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>
<body>

<div class="main-container">

    <div class="image-container">
        <h3>SoftUni</h3>

        <div class="text">
            <h1> Welcome to SoftUni.</h1>
            <h2>Are you ready to become a dev?</h2>
        </div>

        <div class="icons">
            <a href="#"><i class="fa-solid fa-earth-americas"></i></a>
            <a href="#"><i class="fa-brands fa-github"></i></a>
            <a href="#"><i class="fa-brands fa-twitter"></i></a>
        </div>

    </div>


    <div class="form-container">
        <form method="POST" action="#">
            <label for="username"> USERNAME</label>
            <input type="text" name="username" id="username" placeholder="antoniyaat">

            <label for="email"> EMAIL</label>
            <input type="email" name="email" id="email" placeholder="a.atanasova@softuni.bg">

            <label for="password"> PASSWORD</label>
            <input type="password" name="password" id="password" placeholder="********">

            <label for="rpassword"> REPEAT PASSWORD</label>
            <input type="rpassword" name="rpassword" id="rpassword" placeholder="********">

            <div class="options">
                <button>REGISTER</button>
                <a href="#">I am already a ninja</a>

            </div>


        </form>
    </div>

</div>


</body>
</html>
